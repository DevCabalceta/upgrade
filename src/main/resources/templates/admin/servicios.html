<!DOCTYPE html>
<html th:replace="~{admin/layout/admin-layout :: layout('Servicios', 'servicios', ~{::#page-content})}"
      xmlns:th="http://www.thymeleaf.org">
    <body>

        <div id="page-content" class="space-y-6">

            <div>
                <h1 class="text-2xl font-bold tracking-tight md:text-3xl">Servicios</h1>
                <p class="mt-1 text-sm text-muted-foreground">
                    Administra el catálogo de servicios que Upgrade! ofrece a sus clientes.
                </p>
            </div>

            <div class="overflow-visible rounded-2xl border border-border bg-card">
                <div th:if="${servicios.hasContent()}" class="overflow-x-auto">
                    <table class="w-full min-w-[720px] text-sm">
                        <thead class="border-b border-border bg-muted/40">
                            <tr class="text-left text-xs text-muted-foreground">
                                <th class="px-6 py-3 font-semibold">Servicio</th>
                                <th class="px-4 py-3 font-semibold">Descripción</th>
                                <th class="px-4 py-3 font-semibold">Precio base</th>
                                <th class="px-4 py-3 font-semibold">Estado</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr th:each="servicio : ${servicios.content}"
                                class="border-b border-border transition last:border-0 hover:bg-muted/30">
                                <td class="px-6 py-4">
                                    <div class="flex items-center gap-3">
                                        <span class="brand-gradient flex h-10 w-10 shrink-0 items-center justify-center rounded-full text-xs font-black text-black"
                                              th:text="${servicio.iniciales}">SV</span>
                                        <span class="block max-w-72 truncate font-semibold text-foreground"
                                              th:text="${servicio.nombre}">Nombre del servicio</span>
                                    </div>
                                </td>
                                <td class="px-4 py-4 max-w-sm">
                                    <span class="block truncate text-muted-foreground"
                                          th:text="${servicio.descripcion} ?: 'Sin descripción'">Descripción</span>
                                </td>
                                <td class="px-4 py-4 font-medium"
                                    th:text="${'₡' + #numbers.formatDecimal(servicio.precioBase, 1, 'COMMA', 2, 'POINT')}">
                                    ₡0.00
                                </td>
                                <td class="px-4 py-4">
                                    <span th:if="${servicio.activo}"
                                          class="inline-flex rounded-md border border-emerald-500/30 bg-emerald-50 px-2.5 py-0.5 text-xs font-semibold text-emerald-700 dark:border-emerald-500/40 dark:bg-emerald-950/50 dark:text-emerald-400">
                                        Activo
                                    </span>
                                    <span th:unless="${servicio.activo}"
                                          class="inline-flex rounded-md border border-red-500/30 bg-red-50 px-2.5 py-0.5 text-xs font-semibold text-red-700 dark:border-red-500/40 dark:bg-red-950/50 dark:text-red-400">
                                        Inactivo
                                    </span>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>

                <div th:unless="${servicios.hasContent()}" class="px-6 py-16 text-center">
                    <h3 class="mt-4 font-semibold">No hay servicios registrados todavía</h3>
                </div>
            </div>

        </div>

    </body>
</html>
