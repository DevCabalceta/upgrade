<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Inventario — Upgrade</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<div class="container py-5">

    <h2 class="mb-4">
        Crear elemento de inventario
    </h2>

    <div class="card shadow-sm">

        <div class="card-body">

            <form th:action="@{/admin/inventario/guardar}"
                  th:object="${inventario}"
                  method="post">

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Código
                        </label>

                        <input type="text"
                               class="form-control"
                               th:field="*{codigo}"
                               required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Nombre
                        </label>

                        <input type="text"
                               class="form-control"
                               th:field="*{nombre}"
                               required>

                    </div>

                </div>

                <div class="mb-3">

                    <label class="form-label">
                        Descripción
                    </label>

                    <textarea class="form-control"
                              th:field="*{descripcion}">
                    </textarea>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Número de serie
                        </label>

                        <input type="text"
                               class="form-control"
                               th:field="*{numeroSerie}">

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Valor unitario
                        </label>

                        <input type="number"
                               step="0.01"
                               min="0"
                               class="form-control"
                               th:field="*{valorUnitario}"
                               required>

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Cantidad total
                        </label>

                        <input type="number"
                               min="0"
                               class="form-control"
                               th:field="*{cantidadTotal}"
                               required>

                    </div>

                    <div class="col-md-6 mb-3">

                        <label class="form-label">
                            Cantidad disponible
                        </label>

                        <input type="number"
                               min="0"
                               class="form-control"
                               th:field="*{cantidadDisponible}"
                               required>

                    </div>

                </div>

                <div class="row">

                    <div class="col-md-4 mb-3">

                        <label class="form-label">
                            Estado
                        </label>

                        <select class="form-select"
                                th:field="*{estado}"
                                required>

                            <option value="">
                                Seleccione
                            </option>

                            <option value="En Bodega">
                                En Bodega
                            </option>

                            <option value="Prestado">
                                Prestado
                            </option>

                            <option value="Mantenimiento">
                                Mantenimiento
                            </option>

                        </select>

                    </div>

                    <div class="col-md-4 mb-3">

                        <label class="form-label">
                            Fecha de adquisición
                        </label>

                        <input type="date"
                               class="form-control"
                               th:field="*{fechaAdquisicion}">

                    </div>

                    <div class="col-md-4 mb-3">

                        <label class="form-label">
                            Categoría
                        </label>

                        <select class="form-select"
                                th:field="*{categoria.id}"
                                required>

                            <option value="">
                                Seleccione
                            </option>

                            <option th:each="categoria : ${categorias}"
                                    th:value="${categoria.id}"
                                    th:text="${categoria.nombre}">
                            </option>

                        </select>

                    </div>

                </div>

                <button type="submit"
                        class="btn btn-primary">

                    Guardar

                </button>

            </form>

        </div>

    </div>

</div>

</body>
</html>
