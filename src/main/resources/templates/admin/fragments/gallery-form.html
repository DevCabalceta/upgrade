<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<th:block th:fragment="filters">
    <input type="hidden" name="buscar" th:value="${buscar}">
    <input type="hidden" name="tipoFiltro" th:value="${tipoFiltro}">
    <input type="hidden" name="estadoFiltro" th:value="${estadoFiltro}">
    <input type="hidden" name="categoriaFiltro" th:value="${categoriaFiltro}">
    <input type="hidden" name="ordenFiltro" th:value="${ordenFiltro}">
</th:block>

<div th:fragment="fields(mode)" class="grid gap-6 lg:grid-cols-[minmax(0,1.05fr)_minmax(0,.95fr)]">
    <div class="space-y-5">
        <section>
            <div class="mb-3 flex items-center gap-2"><span class="h-1 w-1 rounded-full bg-primary"></span><h3 class="text-xs font-bold uppercase tracking-wider text-muted-foreground">Archivo multimedia</h3><span class="h-px flex-1 bg-border"></span></div>

            <select th:field="*{fuente}" class="js-gallery-source sr-only" tabindex="-1" aria-hidden="true">
                <option th:each="fuente : ${fuentesGaleria}" th:value="${fuente.name()}" th:text="${fuente.etiqueta}"></option>
            </select>
            <div class="mb-3 inline-flex rounded-lg bg-muted p-1">
                <button type="button" data-source-mode="ARCHIVO" class="gallery-source-btn rounded-md px-3 py-1.5 text-xs font-semibold text-muted-foreground transition">Subir archivo</button>
                <button type="button" data-source-mode="URL" class="gallery-source-btn rounded-md px-3 py-1.5 text-xs font-semibold text-muted-foreground transition">Usar enlace</button>
            </div>

            <div class="gallery-file-source">
                <label class="gallery-dropzone flex min-h-52 cursor-pointer flex-col items-center justify-center rounded-xl border-2 border-dashed border-border bg-muted/20 p-6 text-center transition hover:border-primary/50 hover:bg-primary/5">
                    <span class="flex h-12 w-12 items-center justify-center rounded-full bg-primary/10 text-primary"><i data-lucide="upload-cloud" class="h-5 w-5"></i></span>
                    <span class="mt-3 text-sm font-semibold">Arrastra una foto o video</span>
                    <span class="mt-1 text-xs text-muted-foreground">o haz clic para buscar en tu dispositivo</span>
                    <span class="mt-3 rounded-md border border-border bg-background px-2.5 py-1 text-[10px] text-muted-foreground">JPG, PNG, WebP, MP4 o WebM</span>
                    <input th:field="*{archivoMedia}" type="file" accept="image/jpeg,image/png,image/webp,video/mp4,video/webm" class="js-gallery-media-file hidden">
                </label>
                <div class="gallery-selected-file mt-2 hidden items-center justify-between gap-3 rounded-lg border border-border p-2.5 text-xs">
                    <div class="flex min-w-0 items-center gap-2"><i data-lucide="paperclip" class="h-3.5 w-3.5 shrink-0 text-primary"></i><span class="gallery-selected-file-name truncate"></span></div>
                    <button type="button" class="js-gallery-remove-file shrink-0 font-semibold text-destructive">Quitar</button>
                </div>
                <label class="gallery-file-poster mt-3 hidden space-y-1.5"><span class="text-xs font-semibold">Portada del video <span class="font-normal text-muted-foreground">(opcional)</span></span><input th:field="*{archivoPortada}" type="file" accept="image/jpeg,image/png,image/webp" class="js-gallery-poster-file block w-full rounded-md border border-input bg-background text-sm file:mr-3 file:border-0 file:bg-muted file:px-3 file:py-2 file:text-xs file:font-semibold"><span class="text-xs text-muted-foreground">Se utilizará como miniatura antes de reproducir el video.</span></label>
            </div>

            <div class="gallery-url-source hidden space-y-4">
                <label class="block space-y-1.5"><span class="text-xs font-semibold">URL del archivo <b class="text-destructive">*</b></span><input th:field="*{mediaUrl}" type="url" placeholder="https://…" class="js-gallery-media-url gallery-form-control h-9 w-full rounded-md border border-input bg-transparent px-3 text-sm outline-none focus:border-primary/50 focus:ring-1 focus:ring-primary/30"></label>
                <label class="gallery-url-poster hidden space-y-1.5"><span class="text-xs font-semibold">Portada del video</span><input th:field="*{portadaUrl}" type="url" placeholder="https://…/poster.webp" class="gallery-form-control h-9 w-full rounded-md border border-input bg-transparent px-3 text-sm outline-none focus:border-primary/50 focus:ring-1 focus:ring-primary/30"><span class="text-xs text-muted-foreground">Se utilizará como miniatura antes de reproducir el video.</span></label>
            </div>
        </section>

        <section>
            <div class="mb-3 flex items-center gap-2"><span class="h-1 w-1 rounded-full bg-primary"></span><h3 class="text-xs font-bold uppercase tracking-wider text-muted-foreground">Información</h3><span class="h-px flex-1 bg-border"></span></div>
            <div class="grid gap-4 sm:grid-cols-2">
                <label class="space-y-1.5 sm:col-span-2"><span class="text-xs font-semibold">Nombre del proyecto <b class="text-destructive">*</b></span><input th:field="*{titulo}" type="text" maxlength="150" placeholder="Ej. Concierto Arena Norte" class="gallery-form-control h-9 w-full rounded-md border border-input bg-transparent px-3 text-sm outline-none focus:border-primary/50 focus:ring-1 focus:ring-primary/30"><span th:errors="*{titulo}" class="text-xs text-destructive"></span></label>
                <label class="space-y-1.5"><span class="text-xs font-semibold">Categoría <b class="text-destructive">*</b></span><select th:field="*{categoriaId}" class="gallery-form-control h-9 w-full rounded-md border border-input bg-background px-3 text-sm outline-none focus:border-primary/50"><option value="">Seleccionar…</option><option th:each="categoria : ${categoriasGaleria}" th:value="${categoria.id}" th:text="${categoria.nombre}"></option></select><span th:errors="*{categoriaId}" class="text-xs text-destructive"></span></label>
                <label class="space-y-1.5"><span class="text-xs font-semibold">Tipo <b class="text-destructive">*</b></span><select th:field="*{tipo}" class="js-gallery-type gallery-form-control h-9 w-full rounded-md border border-input bg-background px-3 text-sm outline-none focus:border-primary/50"><option th:each="tipo : ${tiposGaleria}" th:value="${tipo.name()}" th:text="${tipo.etiqueta}"></option></select></label>
                <label class="space-y-1.5 sm:col-span-2"><span class="text-xs font-semibold">Descripción</span><textarea th:field="*{descripcion}" rows="3" maxlength="600" placeholder="Describe brevemente el proyecto…" class="gallery-form-control w-full rounded-md border border-input bg-transparent px-3 py-2 text-sm outline-none focus:border-primary/50 focus:ring-1 focus:ring-primary/30"></textarea><span th:errors="*{descripcion}" class="text-xs text-destructive"></span></label>
                <label class="space-y-1.5 sm:col-span-2"><span class="text-xs font-semibold">Texto alternativo <b class="text-destructive">*</b></span><input th:field="*{textoAlternativo}" type="text" maxlength="200" placeholder="Descripción accesible del contenido" class="gallery-form-control h-9 w-full rounded-md border border-input bg-transparent px-3 text-sm outline-none focus:border-primary/50 focus:ring-1 focus:ring-primary/30"><span class="text-xs text-muted-foreground">Ayuda a la accesibilidad y al SEO de la galería pública.</span><span th:errors="*{textoAlternativo}" class="text-xs text-destructive"></span></label>
            </div>
        </section>
    </div>

    <div class="space-y-5">
        <section>
            <div class="mb-3 flex items-center gap-2"><span class="h-1 w-1 rounded-full bg-primary"></span><h3 class="text-xs font-bold uppercase tracking-wider text-muted-foreground">Vista previa</h3><span class="h-px flex-1 bg-border"></span></div>
            <div class="gallery-preview-box relative flex aspect-video items-center justify-center overflow-hidden rounded-xl border border-border bg-muted/40 text-muted-foreground"><div class="gallery-preview-placeholder text-center"><i data-lucide="image" class="mx-auto h-8 w-8 opacity-50"></i><div class="mt-2 text-xs">La vista previa aparecerá aquí</div></div></div>
        </section>

        <section>
            <div class="mb-3 flex items-center gap-2"><span class="h-1 w-1 rounded-full bg-primary"></span><h3 class="text-xs font-bold uppercase tracking-wider text-muted-foreground">Publicación</h3><span class="h-px flex-1 bg-border"></span></div>
            <div class="grid gap-4 sm:grid-cols-2">
                <label class="space-y-1.5"><span class="text-xs font-semibold">Tamaño en la landing</span><select th:field="*{diseno}" class="gallery-form-control h-9 w-full rounded-md border border-input bg-background px-3 text-sm outline-none focus:border-primary/50"><option th:each="diseno : ${disenosGaleria}" th:value="${diseno.name()}" th:text="${diseno.etiqueta}"></option></select></label>
                <label class="space-y-1.5"><span class="text-xs font-semibold">Orden actual</span><input type="text" value="Automático" readonly class="gallery-order-display h-9 w-full rounded-md border border-input bg-muted/40 px-3 text-sm text-muted-foreground outline-none"><span class="text-[11px] text-muted-foreground">Se cambia con las flechas de la tabla.</span></label>
                <label class="space-y-1.5"><span class="text-xs font-semibold">Fecha del proyecto <b class="text-destructive">*</b></span><input th:field="*{fechaEvento}" type="date" class="gallery-form-control h-9 w-full rounded-md border border-input bg-transparent px-3 text-sm outline-none focus:border-primary/50"><span th:errors="*{fechaEvento}" class="text-xs text-destructive"></span></label>
                <label class="space-y-1.5"><span class="text-xs font-semibold">Estado</span><select th:field="*{publicado}" class="gallery-form-control h-9 w-full rounded-md border border-input bg-background px-3 text-sm outline-none focus:border-primary/50"><option value="true">Publicado</option><option value="false">Borrador</option></select></label>
            </div>
            <label class="mt-4 flex cursor-pointer items-start gap-3 rounded-xl border border-border p-3 transition hover:border-primary/40"><input th:field="*{destacado}" type="checkbox" class="mt-0.5 h-4 w-4 accent-[var(--primary)]"><span><span class="block text-sm font-semibold">Destacar contenido</span><span class="mt-0.5 block text-xs text-muted-foreground">Tendrá prioridad visual dentro del portafolio.</span></span></label>
        </section>
    </div>
</div>
</body>
</html>
