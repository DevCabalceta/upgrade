<div th:fragment="faqSection" xmlns:th="http://www.thymeleaf.org">
    <section id="faq" th:if="${not #lists.isEmpty(preguntasFrecuentes)}"
             class="mx-auto max-w-4xl scroll-mt-24 px-4 py-24 lg:px-8">
        <div class="mb-14 text-center" data-reveal="fade-up">
            <div class="text-xs font-semibold uppercase tracking-[0.2em] text-primary">Preguntas frecuentes</div>
            <h2 class="mt-3 text-4xl font-bold tracking-tight lg:text-5xl">
                Resolvemos tus dudas antes de tu evento
            </h2>
            <p class="mx-auto mt-4 max-w-2xl text-muted-foreground">
                Conoce cómo trabajamos y cómo podemos ayudarte a crear experiencias audiovisuales profesionales.
            </p>
        </div>

        <div class="border-t border-border/70">
            <div th:each="pregunta, estadoIteracion : ${preguntasFrecuentes}"
                 class="faq-row border-b border-border/70"
                 data-reveal="fade-up"
                 th:attr="data-reveal-delay=${estadoIteracion.index * 50 > 400 ? 400 : estadoIteracion.index * 50}">
                <button type="button" aria-expanded="false"
                        class="faq-trigger group flex w-full cursor-pointer items-center justify-between gap-6 py-6 text-left">
                    <span class="faq-question text-base font-semibold text-foreground transition-colors group-hover:text-primary md:text-lg"
                          th:text="${pregunta.pregunta}">Pregunta frecuente</span>
                    <span class="faq-icon relative flex h-7 w-7 shrink-0 items-center justify-center rounded-full border border-border text-muted-foreground transition-all duration-300 group-hover:border-primary group-hover:text-primary"
                          aria-hidden="true">
                        <span class="absolute h-[1.5px] w-3 bg-current"></span>
                        <span class="absolute h-3 w-[1.5px] bg-current"></span>
                    </span>
                </button>

                <div class="faq-content grid transition-[grid-template-rows] duration-[320ms] ease-[cubic-bezier(0.22,1,0.36,1)]"
                     style="grid-template-rows: 0fr;">
                    <div class="overflow-hidden">
                        <p class="faq-answer pb-6 pr-12 text-sm leading-relaxed text-muted-foreground opacity-0 transition-opacity duration-300 md:text-[15px]"
                           th:text="${pregunta.respuesta}">Respuesta frecuente</p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script>
        $(function () {
            $('.faq-trigger').on('click', function () {
                const $trigger = $(this);
                const $row = $trigger.closest('.faq-row');
                const wasOpen = $trigger.attr('aria-expanded') === 'true';

                $('.faq-trigger').attr('aria-expanded', 'false');
                $('.faq-content').css('grid-template-rows', '0fr');
                $('.faq-answer').removeClass('opacity-100').addClass('opacity-0');
                $('.faq-question').removeClass('text-primary').addClass('text-foreground');
                $('.faq-icon')
                    .removeClass('rotate-45 border-primary bg-primary/10 text-primary')
                    .addClass('border-border text-muted-foreground');

                if (!wasOpen) {
                    $trigger.attr('aria-expanded', 'true');
                    $row.find('.faq-content').css('grid-template-rows', '1fr');
                    $row.find('.faq-answer').removeClass('opacity-0').addClass('opacity-100');
                    $row.find('.faq-question').removeClass('text-foreground').addClass('text-primary');
                    $row.find('.faq-icon')
                        .removeClass('border-border text-muted-foreground')
                        .addClass('rotate-45 border-primary bg-primary/10 text-primary');
                }
            });
        });
    </script>
</div>
